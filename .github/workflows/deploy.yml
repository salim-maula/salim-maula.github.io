name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci failed on the runner with a bare "exit code 1", and Actions logs
      # need sign-in to read. Echoing the real npm error into an ::error::
      # annotation makes it readable from the public API.
      - name: Install dependencies
        run: |
          set +e
          out="$(npm ci --no-audit --no-fund 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            detail="$(printf '%s' "$out" | grep -Ei 'npm (error|ERR|warn)' | head -8 | tr '\n' ' ' | cut -c1-800)"
            echo "::error::npm ci failed (rc=$rc): ${detail:-no npm error lines captured}"
            exit 1
          fi

      - run: npm run lint

      # Static export -> ./out, then .png rename + .nojekyll
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_URL: https://salim-maula.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
